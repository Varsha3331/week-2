<!DOCTYPE html>
git<html>
<head>
  <title>KL University Application Form</title>
</head>
<body style="background-color: #f0f8ff;">

  <div style="text-align: center; margin-top: 50px;">
    <h1>KL University</h1>

    <form style="display: inline-block; text-align: left; background-color: #ffffff; padding: 20px; border-radius: 10px;">
      
      <!-- Name Field -->
      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name"><br><br>

      <!-- Roll Number Field -->
      <label for="rollno">Roll No:</label><br>
      <input type="text" id="rollno" name="rollno"><br><br>

      <!-- Branch Field -->
      <label for="branch">Branch:</label><br>
      <input type="text" id="branch" name="branch"><br><br>

      <!-- Course Selection -->
      <label for="course">Select a Course:</label><br>
      <select id="course" name="course">
        <option value="fedf">FEDF</option>
        <option value="oops">OOPS</option>
        <option value="aiml">AIML</option>
        <option value="daa">DAA</option>
      </select><br><br>

      <!-- Submit Button -->
      <div style="text-align: center;">
        <input type="submit" value="Submit">
      </div>
    </form>
  </div>

</body>
</html>
